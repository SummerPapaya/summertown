name = "summertown"
main = "api/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# `wrangler deploy` deletes any dashboard-set plain-text (Text) variable that
# is not declared here. keep_vars preserves them. Secrets are unaffected
# either way — prefer adding ADMIN_TOKEN as a *Secret*, not Text.
keep_vars = true

# Production hostname. The domain must already be on Cloudflare; wrangler
# creates the DNS record + certificate on first deploy.
# NOTE: top-level keys must stay above the first [table] in TOML.
# TEMPORARILY DISABLED: the custom domain already has externally managed DNS
# records, so `custom_domain = true` fails with code 100117. Deploy to the
# default *.workers.dev first, then attach the custom domain via the dashboard
# (Workers & Pages → your Worker → Settings → Custom Domains) which routes
# without touching existing DNS records.
# routes = [
#   { pattern = "summertown.summercommences.com", custom_domain = true }
# ]

# Static assets (Vite build → dist/public/) served from the same Worker.
# vite.config.ts sets build.outDir = "dist/public", so the trailing segment
# is required — pointing at "./dist" alone makes every asset 404.
[assets]
directory = "./dist/public"
binding = "STATIC"

# D1 database for wishes, postcards, subscriptions, footprints, visits, admin tables
# Create with:  wrangler d1 create summertown-db --location=enam:apac
# then paste the printed `database_id` below.
[[d1_databases]]
binding = "DB"
database_name = "summertown-db"
database_id = "29411610-6639-4384-ad7c-267c42a9f4ce"

# R2 for high-resolution apple-photo images (D1 row cap ~1 MB)
# Create with:  wrangler r2 bucket create summertown-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "summertown-photos"

[vars]
APP_ID = "summertown-public"

# Production secrets are set via `wrangler secret put NAME`:
#   ADMIN_TOKEN   — required to mutate /api/trpc/admin.*
#   APP_SECRET    — reserved for future internal calls

# Local-only overrides live in `.dev.vars` (gitignored).

# Cron triggers (UTC):
#   "0 * * * *"    hourly — rolls old `page_visits` and `rate_limits` rows
#   "0 15 * * *"   daily at 23:00 Asia/Shanghai — imports the owner's own 🍎
#                  posts from 即刻 (no-op unless JIKE_* secrets are set)
[triggers]
crons = ["0 * * * *", "0 15 * * *"]
