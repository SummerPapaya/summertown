<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Where is this visitor? Cloudflare's edge answers at /cdn-cgi/trace on
         every proxied zone, so no Worker hop and no third-party call. Started
         here rather than in the bundle so the lookup runs while the ~1MB of JS
         is still downloading — it is almost always settled by the time React
         mounts, which is what keeps the first paint from flashing the wrong
         language. Resolves to '' anywhere the endpoint is absent (local dev, a
         non-Cloudflare host, offline); see resolveInitialLang() in lib/i18n. -->
    <script>
      window.__stGeo = fetch('/cdn-cgi/trace', { cache: 'no-store' })
        .then(function (r) {
          return r.ok ? r.text() : '';
        })
        .then(function (body) {
          var m = /^loc=(.+)$/m.exec(body);
          return m ? m[1].trim() : '';
        })
        .catch(function () {
          return '';
        });
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Summer Town — Interactive Seaside Map</title>

    <!-- Link cards. WeChat / iMessage / Slack read these from the *server*
         response — they never run our JS — so they have to live in the shell.
         /apple-album needs a different card and gets one injected by the Worker
         (see api/boot.ts). Absolute URLs are required, so the production host
         is spelled out; the Worker rewrites og:url / og:image to whatever host
         actually served the request. -->
    <meta
      name="description"
      content="A tiny seaside town you can wander: the interactive map, the windbell isle, the journal, and one apple a day."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Summer Town" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:url" content="https://summertown.summercommences.com/" />
    <meta property="og:title" content="Summer Town — Interactive Seaside Map" />
    <meta
      property="og:description"
      content="A tiny seaside town you can wander: the interactive map, the windbell isle, the journal, and one apple a day."
    />
    <meta
      property="og:image"
      content="https://summertown.summercommences.com/og/summer-town.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Summer Town seashell mark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Summer Town — Interactive Seaside Map"
    />
    <meta
      name="twitter:description"
      content="A tiny seaside town you can wander: the interactive map, the windbell isle, the journal, and one apple a day."
    />
    <meta
      name="twitter:image"
      content="https://summertown.summercommences.com/og/summer-town.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
