<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Summer Town</title>
  <desc id="desc">Interactive seaside map  -  pan the town, open landmarks, and ferry to Windbell Isle.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFEBF7"/>
      <stop offset="0.55" stop-color="#A5E3D8"/>
      <stop offset="1" stop-color="#FFF3DF"/>
    </linearGradient>
    <linearGradient id="shellGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF9B9B"/>
      <stop offset="1" stop-color="#FFDD94"/>
    </linearGradient>
    <linearGradient id="rayGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFB37E"/>
      <stop offset="1" stop-color="#FFDD94"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="380" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#sky)"/>

    <!-- soft water band -->
    <path d="M0 268 C 180 248 320 292 500 270 C 700 244 860 300 1200 262 L 1200 380 L 0 380 Z" fill="#7EC8E3" opacity="0.55"/>
    <path d="M0 300 C 200 284 360 318 560 298 C 780 276 980 322 1200 296 L 1200 380 L 0 380 Z" fill="#5FA8CF" opacity="0.35"/>

    <!-- sun -->
    <circle cx="1048" cy="86" r="48" fill="#FFDD94"/>
    <circle cx="1048" cy="86" r="62" fill="#FFDD94" opacity="0.28"/>

    <!-- clouds -->
    <g fill="#FFFFFF" opacity="0.85">
      <ellipse cx="860" cy="78" rx="54" ry="20"/>
      <ellipse cx="888" cy="66" rx="36" ry="18"/>
      <ellipse cx="220" cy="92" rx="70" ry="24"/>
      <ellipse cx="258" cy="78" rx="42" ry="20"/>
    </g>

    <!-- wave motif -->
    <path d="M56 322 Q 86 308 116 322 T 176 322 T 236 322"
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

    <!-- title block -->
    <g transform="translate(56 48)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
      <text x="0" y="18" fill="#FF9B9B" font-size="18" font-weight="800" letter-spacing="3.2">A VERY SMALL TOWN BY THE SEA</text>
      <text x="0" y="108" fill="#4A4470" font-size="78" font-weight="800" letter-spacing="-2.5">Summer Town</text>
      <text x="0" y="162" fill="#7B74A3" font-size="26" font-weight="600">Interactive seaside map  -  click every door.</text>
      <text x="0" y="206" fill="#4A4470" font-size="20" font-weight="650">Pan / zoom / tour / ferry to Windbell Isle</text>

      <!-- time-of-day chips -->
      <g transform="translate(0 236)" font-size="16" font-weight="750">
        <rect width="86" height="36" rx="18" fill="#FFF9EF" stroke="#FFFFFF" stroke-width="4"/>
        <circle cx="22" cy="18" r="7" fill="#FFDD94"/>
        <text x="38" y="22" fill="#4A4470">Day</text>

        <rect x="98" width="132" height="36" rx="18" fill="#FFF9EF" stroke="#FFFFFF" stroke-width="4"/>
        <circle cx="120" cy="18" r="7" fill="#FFB37E"/>
        <text x="136" y="22" fill="#4A4470">Golden hour</text>

        <rect x="242" width="118" height="36" rx="18" fill="#FFF9EF" stroke="#FFFFFF" stroke-width="4"/>
        <circle cx="264" cy="18" r="7" fill="#4A4470"/>
        <text x="280" y="22" fill="#4A4470">Starlight</text>
      </g>
    </g>

    <!-- shell badge (project logo motif) -->
    <g transform="translate(980 168)">
      <circle cx="80" cy="80" r="78" fill="#FFF9EF"/>
      <circle cx="80" cy="80" r="78" fill="none" stroke="#FFFFFF" stroke-width="8"/>
      <g fill="url(#rayGrad)">
        <path d="M80 22 L87 64 L73 64 Z"/>
        <path d="M46 34 L68 68 L56 75 Z"/>
        <path d="M114 34 L104 75 L92 68 Z"/>
        <path d="M24 62 L58 82 L50 92 Z"/>
        <path d="M136 62 L110 92 L102 82 Z"/>
      </g>
      <path d="M80 58 C 60 58 44 72 42 92 C 41 103 46 112 54 117 L 80 122 L 106 117 C 114 112 119 103 118 92 C 116 72 100 58 80 58 Z" fill="url(#shellGrad)"/>
      <g stroke="#FFF9EF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9">
        <path d="M80 64 L80 116"/>
        <path d="M62 70 L72 114"/>
        <path d="M98 70 L88 114"/>
        <path d="M48 84 L64 110"/>
        <path d="M112 84 L96 110"/>
      </g>
      <circle cx="72" cy="120" r="3.2" fill="#4A4470" opacity="0.55"/>
      <circle cx="88" cy="120" r="3.2" fill="#4A4470" opacity="0.55"/>
      <path d="M38 132 Q 50 125 62 132 T 86 132 T 110 132 T 134 132"
            fill="none" stroke="#7EC8E3" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
