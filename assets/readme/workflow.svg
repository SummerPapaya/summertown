<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">How a visit works</title>
  <desc id="desc">Arrive, explore the map, open a landmark, then ferry to Windbell Isle.</desc>
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9EF"/>
      <stop offset="1" stop-color="#FFF3DF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#board)"/>
  <rect x="4" y="4" width="1192" height="312" rx="26" fill="none" stroke="#FFFFFF" stroke-width="6"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="56" y="52" fill="#FF9B9B" font-size="16" font-weight="800" letter-spacing="3">A SHORT WALK THROUGH TOWN</text>
    <text x="56" y="96" fill="#4A4470" font-size="34" font-weight="800">How a visit works</text>
  </g>

  <!-- connector path -->
  <path d="M170 210 H1030" fill="none" stroke="#CFEBF7" stroke-width="8" stroke-linecap="round"/>
  <circle cx="170" cy="210" r="8" fill="#FF9B9B"/>
  <circle cx="456" cy="210" r="8" fill="#7EC8E3"/>
  <circle cx="742" cy="210" r="8" fill="#FFB37E"/>
  <circle cx="1030" cy="210" r="8" fill="#FFDD94"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <!-- 1 -->
    <g transform="translate(70 130)">
      <rect width="200" height="150" rx="24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="36" cy="36" r="18" fill="#FF9B9B"/>
      <text x="36" y="42" text-anchor="middle" font-size="18" font-weight="800" fill="#FFF9EF">1</text>
      <text x="24" y="86" font-size="22" font-weight="800" fill="#4A4470">Arrive</text>
      <text x="24" y="116" font-size="16" font-weight="600" fill="#7B74A3">Land on the map</text>
      <text x="24" y="140" font-size="16" font-weight="600" fill="#7B74A3">with the ferry tour</text>
    </g>

    <!-- 2 -->
    <g transform="translate(356 130)">
      <rect width="200" height="150" rx="24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="36" cy="36" r="18" fill="#7EC8E3"/>
      <text x="36" y="42" text-anchor="middle" font-size="18" font-weight="800" fill="#FFF9EF">2</text>
      <text x="24" y="86" font-size="22" font-weight="800" fill="#4A4470">Explore</text>
      <text x="24" y="116" font-size="16" font-weight="600" fill="#7B74A3">Pan, zoom, and</text>
      <text x="24" y="140" font-size="16" font-weight="600" fill="#7B74A3">filter landmarks</text>
    </g>

    <!-- 3 -->
    <g transform="translate(642 130)">
      <rect width="200" height="150" rx="24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="36" cy="36" r="18" fill="#FFB37E"/>
      <text x="36" y="42" text-anchor="middle" font-size="18" font-weight="800" fill="#FFF9EF">3</text>
      <text x="24" y="86" font-size="22" font-weight="800" fill="#4A4470">Step inside</text>
      <text x="24" y="116" font-size="16" font-weight="600" fill="#7B74A3">Open a building</text>
      <text x="24" y="140" font-size="16" font-weight="600" fill="#7B74A3">for lore &amp; facts</text>
    </g>

    <!-- 4 -->
    <g transform="translate(928 130)">
      <rect width="200" height="150" rx="24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="36" cy="36" r="18" fill="#FFDD94"/>
      <text x="36" y="42" text-anchor="middle" font-size="18" font-weight="800" fill="#4A4470">4</text>
      <text x="24" y="86" font-size="22" font-weight="800" fill="#4A4470">Ferry on</text>
      <text x="24" y="116" font-size="16" font-weight="600" fill="#7B74A3">Walk Windbell Isle,</text>
      <text x="24" y="140" font-size="16" font-weight="600" fill="#7B74A3">journal, or visit</text>
    </g>
  </g>
</svg>
